{% extends "base.html" %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">مدیریت واژه</p><h1>آدم‌ها، پیش از جلسه‌ها.</h1><p class="muted">درخواست‌های عضویت را بررسی کنید و دسترسی کاربران را مدیریت کنید.</p></div><span id="user-count" class="count"></span></div><section class="admin-panel"><div class="admin-tools"><label class="search-box"><input id="user-search" type="search" placeholder="جست‌وجوی نام یا شماره همراه" aria-label="جست‌وجوی کاربران"></label><select id="user-filter" class="text-input" aria-label="وضعیت حساب"><option value="pending">در انتظار تأیید</option><option value="approved">فعال</option><option value="suspended">متوقف‌شده</option><option value="">همهٔ کاربران</option></select></div><div id="admin-users" aria-live="polite"><p class="empty">در حال دریافت کاربران…</p></div><p id="admin-error" class="inline-error" role="alert"></p><button id="admin-more" class="btn load-more" hidden>صفحهٔ بعد</button></section>{% endblock %}
{% block page_scripts %}<script src="/static/accounts.js?v=3" defer></script>{% endblock %}
