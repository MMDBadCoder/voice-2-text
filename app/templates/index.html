{% extends "base.html" %}
{% block content %}
<div class="page-heading">
  <div>
    <h1>جلسه‌ها</h1>
    <p class="muted">صداها را جمع کنید یا زنده صحبت کنید؛ متن همان‌جا ساخته می‌شود.</p>
  </div>
  <button class="btn primary" id="new-session-btn"><svg aria-hidden="true"><use href="#i-plus"/></svg>جلسهٔ جدید</button>
</div>

<section class="session-library">
  <div class="library-toolbar">
    <label class="search-box">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="session-search" type="search" placeholder="جست‌وجو…" aria-label="جست‌وجو در جلسه‌ها">
    </label>
    <span class="count" id="session-count"></span>
  </div>
  <div class="filter-tabs" role="group" aria-label="فیلتر جلسه‌ها">
    <button data-session-filter="" aria-pressed="true">همه</button>
    <button data-session-filter="open" aria-pressed="false">باز</button>
    <button data-session-filter="running" aria-pressed="false">در حال تبدیل</button>
    <button data-session-filter="done" aria-pressed="false">آماده</button>
  </div>
  <div class="session-grid" id="session-list"><div class="skeleton"></div><div class="skeleton"></div></div>
  <p class="inline-error" id="library-error" role="status"></p>
  <div class="pagination">
    <button class="btn small" id="sessions-prev" hidden>قبلی</button>
    <button class="btn small" id="sessions-next" hidden>بعدی</button>
  </div>
</section>

<dialog id="new-session-dialog" aria-labelledby="new-session-title"><form id="new-session-form">
  <h2 id="new-session-title">جلسهٔ جدید</h2>
  <label class="field-label" for="session-title">عنوان</label>
  <input class="text-input" id="session-title" name="title" placeholder="مثلاً جلسهٔ برنامه‌ریزی هفته" maxlength="200" required autofocus>
  <fieldset class="tiers">
    <legend>روش تبدیل</legend>
    <div class="tier-options">
      {% for t in tiers %}
      <label class="tier">
        <input type="radio" name="tier" value="{{ t.value }}" {% if t.value == default_tier %}checked{% endif %}>
        <span><strong>{{ t.label }}</strong><small>{{ t.hint }}</small></span>
      </label>
      {% endfor %}
    </div>
  </fieldset>
  <div class="actions">
    <button class="btn primary" id="create-session-submit">ساخت جلسه</button>
    <button class="btn" type="button" id="dismiss-new-session">انصراف</button>
  </div>
  <p id="create-error" class="inline-error" role="alert"></p>
</form></dialog>
{% endblock %}
{% block scripts %}<script>window.APP = {page: "workspace"};</script>{% endblock %}
{% block page_scripts %}<script src="/static/sessions.js?v=5" defer></script>{% endblock %}
